<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - InsureSence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

  <!-- Ambient Glowing Background Elements -->
  <div class="bg-glow-orb-1"></div>
  <div class="bg-glow-orb-2"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/home"><i class="bi bi-shield-check"></i> Insure<span>Sence</span></a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="glass-card mx-auto" style="max-width: 460px;">
      <h3 class="text-center mb-2 text-gradient"><i class="bi bi-box-arrow-in-right me-1"></i> Welcome Back</h3>
      <p class="text-center text-sub small mb-4">Choose your preferred login method to access your dashboard</p>

      {% if error %}
      <div class="alert alert-danger py-2 small rounded-3 mb-3 text-center">{{ error }}</div>
      {% endif %}

      <!-- Auth Method Selector Tabs -->
      <ul class="nav nav-pills nav-justified mb-4 p-1 bg-dark bg-opacity-60 rounded-3 border border-secondary border-opacity-25" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active py-2 small fw-bold" id="password-tab" data-bs-toggle="pill" data-bs-target="#password-pane" type="button" role="tab"><i class="bi bi-key-fill me-1"></i> Password</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link py-2 small fw-bold" id="otp-tab" data-bs-toggle="pill" data-bs-target="#otp-pane" type="button" role="tab"><i class="bi bi-envelope-check-fill me-1"></i> Email OTP</button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">
        
        <!-- Tab 1: Password Login -->
        <div class="tab-pane fade show active" id="password-pane" role="tabpanel">
          <form method="POST">
            <input type="hidden" name="login_type" value="password">
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-sub"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-control border-secondary" placeholder="name@example.com" required autocomplete="email">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-sub"><i class="bi bi-lock"></i></span>
                <input type="password" id="loginPassword" name="password" class="form-control border-secondary" placeholder="Your password" required autocomplete="current-password">
                <button class="btn btn-outline-secondary" type="button" id="toggleLoginPassword"><i class="bi bi-eye"></i></button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2 fw-bold">
              Log In with Password <i class="bi bi-shield-lock me-1"></i>
            </button>
          </form>
        </div>

        <!-- Tab 2: OTP Login -->
        <div class="tab-pane fade" id="otp-pane" role="tabpanel">
          <form method="POST">
            <input type="hidden" name="login_type" value="otp">
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-sub"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-control border-secondary" placeholder="name@example.com" required autocomplete="email">
              </div>
            </div>

            <button type="submit" class="btn btn-success-custom w-100 py-2 mt-2 fw-bold">
              Request One-Time Code <i class="bi bi-send me-1"></i>
            </button>
          </form>
        </div>

      </div>

      <hr class="my-4 border-secondary opacity-25">
      <div class="text-center small text-sub">
        Don't have an account yet? <a href="/signup" class="text-info fw-bold text-decoration-none">Sign Up</a>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 InsureSence. All rights reserved.</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='particles.js') }}"></script>
  <script>
    const toggleLoginPassword = document.getElementById('toggleLoginPassword');
    const loginPassword = document.getElementById('loginPassword');

    toggleLoginPassword.addEventListener('click', function() {
      const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
      loginPassword.setAttribute('type', type);
      this.querySelector('i').classList.toggle('bi-eye');
      this.querySelector('i').classList.toggle('bi-eye-slash');
    });
  </script>
</body>
</html>
