<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify OTP - InsureSence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

  <!-- Ambient Glowing Background Elements -->
  <div class="bg-glow-orb-1"></div>
  <div class="bg-glow-orb-2"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/home"><i class="bi bi-shield-check"></i> Insure<span>Sence</span></a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="glass-card mx-auto" style="max-width: 440px;">
      <h3 class="text-center mb-2 text-gradient"><i class="bi bi-shield-lock-fill me-1"></i> Verify OTP</h3>
      <p class="text-center text-sub small mb-3">
        Enter the 6-digit One-Time Password sent to<br>
        <strong class="text-white">{{ email }}</strong>
      </p>

      {% if error %}
      <div class="alert alert-danger py-2 small rounded-3 mb-3 text-center">{{ error }}</div>
      {% endif %}

      {% if otp %}
      <div class="alert alert-warning py-2 small rounded-3 mb-3 text-center bg-dark border-warning border-opacity-50 text-warning">
        <i class="bi bi-info-circle me-1"></i> <strong>Development OTP:</strong> <span class="badge bg-warning text-dark fs-6">{{ otp }}</span>
      </div>
      {% endif %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">6-Digit OTP Code (Expires in 5 mins)</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-sub"><i class="bi bi-lock"></i></span>
            <input type="text" name="otp" class="form-control border-secondary text-center font-monospace fs-5 letter-spacing-2" placeholder="123456" maxlength="6" required autofocus>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2 fw-bold">
          Verify & Continue <i class="bi bi-check-circle me-1"></i>
        </button>
      </form>

      <div class="text-center mt-3 small text-sub">
        Didn't receive the code or expired? <a href="/signup" class="text-info fw-bold text-decoration-none">Resend OTP</a>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 InsureSence. All rights reserved.</footer>

  <script src="{{ url_for('static', filename='particles.js') }}"></script>
</body>
</html>
