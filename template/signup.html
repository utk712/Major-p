<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - InsureSence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

  <!-- Ambient Glowing Background Elements -->
  <div class="bg-glow-orb-1"></div>
  <div class="bg-glow-orb-2"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/home"><i class="bi bi-shield-check"></i> Insure<span>Sence</span></a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="glass-card mx-auto" style="max-width: 460px;">
      <h3 class="text-center mb-2 text-gradient"><i class="bi bi-person-plus-fill me-1"></i> Create Account</h3>
      <p class="text-center text-sub small mb-4">Register with your email and password to secure your account</p>

      {% if error %}
      <div class="alert alert-danger py-2 small rounded-3 mb-3 text-center">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-sub"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control border-secondary" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Create Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-sub"><i class="bi bi-lock"></i></span>
            <input type="password" id="signupPassword" name="password" class="form-control border-secondary" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
            <button class="btn btn-outline-secondary" type="button" id="togglePassword"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-3 fw-bold">
          Create Account & Verify OTP <i class="bi bi-arrow-right me-1"></i>
        </button>
      </form>

      <hr class="my-4 border-secondary opacity-25">
      <div class="text-center small text-sub">
        Already have an account? <a href="/login" class="text-info fw-bold text-decoration-none">Log In</a>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 InsureSence. All rights reserved.</footer>

  <script src="{{ url_for('static', filename='particles.js') }}"></script>
  <script>
    const togglePassword = document.getElementById('togglePassword');
    const signupPassword = document.getElementById('signupPassword');

    togglePassword.addEventListener('click', function() {
      const type = signupPassword.getAttribute('type') === 'password' ? 'text' : 'password';
      signupPassword.setAttribute('type', type);
      this.querySelector('i').classList.toggle('bi-eye');
      this.querySelector('i').classList.toggle('bi-eye-slash');
    });
  </script>
</body>
</html>
